# Overrides for gamescope-session-plus when launching the Steam Big
# Picture session from SDDM. Sourced by
# /usr/share/gamescope-session-plus/gamescope-session-plus before it
# builds the gamescope command line.
#
# Monitor: LG Ultrawide 38" -- preferred native mode 3840x1600.

# Turn on gamescope's HDR pipeline. Without this, gamescope is launched
# without --hdr-enabled and the HDR swap chain is unavailable to the
# game, so Elden Ring's HDR menu entry disappears entirely.
# This also exports DXVK_HDR=1 inside the session script.
ENABLE_GAMESCOPE_HDR=1

# Pin gamescope's output surface to the monitor's native mode.
# Without these, gamescope tends to pick 1920x1080 from the EDID's
# Standard Timings instead of the 3840x1600 DTD, which is why Steam
# Big Picture has been rendering 16:9.
SCREEN_WIDTH=3840
SCREEN_HEIGHT=1600

# Pin gamescope's nested display size (what apps inside gamescope see
# as their display) to match the output. Without these, gamescope's
# nested XWayland advertises a smaller mode (typically 1920x1080) to
# clients, so ER's fullscreen swap chain is created at that size and
# gets letterboxed onto the 3840x1600 monitor.
#
# Previous concern: HDR toggle greyed out when these were set. That
# turned out to be a borderless-mode artifact, not a -w/-h problem.
# In ER's borderless mode the game won't initialize HDR regardless of
# our config (the game gates HDR on IsFullscreenExclusive()). In
# fullscreen with these set, HDR engages and the ultrawide patch
# extends the render to fill the nested 3840x1600 surface.
INTERNAL_WIDTH=3840
INTERNAL_HEIGHT=1600

# Enable FreeSync/VRR (monitor advertises 48-144 Hz adaptive range).
ADAPTIVE_SYNC=1
