# Autostart necessary processes (like notifications daemons, status bars, etc.)
exec-once = waybar
exec-once = hyprsunset
exec-once = hypridle
exec-once = elephant
exec-once = walker --gapplication-service
exec-once = ~/.config/hypr/hotcorner.sh
exec-once = ~/.config/hypr/wallpaper-rotator.sh
exec-once = ~/.config/hypr/scripts/dofus-mouse-remap.sh
exec-once = synology-drive
exec-once = librepods --hide
