general {
    lock_cmd = ~/.config/hypr/scripts/lock.sh # Lock screen; Claude sessions go to Remote Control while locked
    before_sleep_cmd = loginctl lock-session # Lock before suspend
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})' # To avoid having to press a key twice to turn on the display
    inhibit_sleep = 3 # Wait until screen is locked
    ignore_dbus_inhibit = false
}

listener {
    timeout = 150 # 2.5 minutes
    on-timeout = ~/.config/hypr/scripts/lock-if-not-gaming.sh
}

listener {
    timeout = 300 # 5 minutes
    on-timeout = ~/.config/hypr/scripts/lock-session-if-not-gaming.sh # Lock screen when timeout has passes
}

listener {
    timeout = 330 # 5.5 minutes
    on-timeout = ~/.config/hypr/scripts/screen-off-if-not-gaming.sh # Screen off when timeout has passes
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})' && ~/.config/hypr/brightness-adjust-focused.sh =100 # Screen on at full brightness when activity is detected
}

# The Claude workspace (6) is exempt from the three listeners above: watching a session is idle
# time to hypridle. There the lock comes after 10 minutes and asks first (a screen over the
# blurred desktop, 30 s to answer with any key, click or move), then it goes dark 30 s after the lock.
listener {
    timeout = 600 # 10 minutes
    on-timeout = ~/.config/hypr/scripts/claude-idle.sh prompt
    on-resume = ~/.config/hypr/scripts/claude-idle.sh cancel
}
