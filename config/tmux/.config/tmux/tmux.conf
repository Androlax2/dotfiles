# True colour inside kitty, then the Tokyo Night status line and borders.
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-kitty:RGB"
set -g clock-mode-style 24
set -g mouse on
source-file ~/.config/tmux/tokyonight_night.tmux

# claude-auto-retry wraps every Claude session in its own tmux session; the
# status line there only duplicates what the Claude UI already shows.
set-hook -g session-created 'if -F "#{m:claude-retry-*,#{hook_session_name}}" "set status off"'
