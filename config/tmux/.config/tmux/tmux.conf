# True colour inside kitty, then the Tokyo Night status line and borders.
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-kitty:RGB"
set -g clock-mode-style 24
set -g mouse on
# Claude Code sets the pane title (OSC 0) to its current task; pass it on so the kitty/Hyprland window carries it.
set -g set-titles on
set -g set-titles-string "#{pane_title}"
source-file ~/.config/tmux/tokyonight_night.tmux
# opencode copies only through OSC 52 (no wl-copy, and its sandbox hides the Wayland socket); the
# default, external, drops a pane's OSC 52, so its "copied" reached no clipboard. on passes it to
# kitty, which writes the Wayland clipboard. Any pane can now set the clipboard, sandboxed ones too.
set -s set-clipboard on
