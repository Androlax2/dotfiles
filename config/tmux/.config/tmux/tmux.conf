# True colour inside kitty, then the Tokyo Night status line and borders.
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-kitty:RGB"
set -g clock-mode-style 24
set -g mouse on
# Claude Code sets the pane title (OSC 0) to its current task; pass it on so the kitty/Hyprland window carries it.
set -g set-titles on
set -g set-titles-string "#{pane_title}"
source-file ~/.config/tmux/tokyonight_night.tmux

# claude-auto-retry wraps every Claude session in its own tmux session, and claude-sessions
# (the manager) is one more; the status line there only duplicates what the UIs already show.
set-hook -g session-created 'if -F "#{m:claude-*,#{hook_session_name}}" "set status off"'
# A session is often attached twice (its own terminal and the manager's viewer pane): follow
# the client that was used last instead of shrinking to the smaller one.
set -g window-size latest
# Claude session manager: Ctrl+Tab (the physical Cmd+Tab with the keyd swap; Hyprland leaves
# Ctrl+Tab alone) cycles its panes, Ctrl+1/2/3 jump to a sidebar panel from the session pane, Left
# goes from the session pane back to the column (below). All work without the prefix and only in
# the manager; in every other session the keys reach the application as usual.
# kitty encodes Ctrl+Tab as a plain Tab and Ctrl+& as & unless told otherwise, so the manager's
# kitty window loads claude-sessions.conf, which sends these chords as modifyOtherKeys sequences.
# The sidebar is the leftmost pane and takes F1-F3, so a digit is never typed into its filter.
set -s extended-keys on
set -as terminal-features 'xterm-kitty:extkeys'
bind -n C-Tab   if -F '#{==:#{session_name},claude-manager}' 'select-pane -t :.+' 'send-keys C-Tab'
bind -n C-S-Tab if -F '#{==:#{session_name},claude-manager}' 'select-pane -t :.-' 'send-keys C-S-Tab'
bind -n C-BTab  if -F '#{==:#{session_name},claude-manager}' 'select-pane -t :.-' 'send-keys C-BTab'
bind -n C-1 if -F '#{==:#{session_name},claude-manager}' 'select-pane -t "{left}"; send-keys -t "{left}" F1' 'send-keys C-1'
bind -n C-2 if -F '#{==:#{session_name},claude-manager}' 'select-pane -t "{left}"; send-keys -t "{left}" F2' 'send-keys C-2'
bind -n C-3 if -F '#{==:#{session_name},claude-manager}' 'select-pane -t "{left}"; send-keys -t "{left}" F3' 'send-keys C-3'
# In the manager's session pane (role viewer, claude-sessions), Left always goes back to the column,
# as l and → come from it; Claude never gets it there. The nested session's own client sees no
# role, so Left still reaches Claude when the session is attached anywhere else.
bind -n Left if -F '#{&&:#{==:#{session_name},claude-manager},#{==:#{@role},viewer}}' 'select-pane -t "{left}"' 'send-keys Left'
# Alt+Q: a prompt for the end of the session's turn (claude-sessions queue-prompt-ask), in the
# cockpit's session pane or a Claude session's own tmux session; elsewhere the key passes through.
bind -n M-q if -F '#{||:#{&&:#{==:#{session_name},claude-manager},#{==:#{@role},viewer}},#{m:claude-retry-*,#{session_name}}}' \
    'display-popup -E -w 70% -h 7 -T " queue a prompt for the end of this turn " "claude-sessions queue-prompt-ask #{pane_id}"' \
    'send-keys M-q'
