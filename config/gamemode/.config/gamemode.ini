; Feral GameMode while a game runs. Hyprland registers each game window's process
; (game-mode.lua: gamemoded -r <pid>); GameMode ends when that process exits.
[general]
; How often GameMode checks that the registered game still runs.
reaper_freq=5
; amd_pstate (active): the performance governor also sets the EPP hint to performance.
desiredgov=performance
defaultgov=powersave
inhibit_screensaver=1

[gpu]
; The RDNA card is card1 (/sys/class/drm/card1): highest clocks while the game runs, "auto" after.
apply_gpu_optimisations=accept-responsibility
gpu_device=1
amd_performance_level=high

[custom]
; Pause the heavy timers and drop background work (Claude sessions, backups) to idle priority.
start=/home/theo/.local/bin/game-performance on
end=/home/theo/.local/bin/game-performance off
script_timeout=10
