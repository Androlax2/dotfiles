# Font
font_family                 JetBrainsMono Nerd Font
font_size                   12
bold_font                   auto
italic_font                 auto
bold_italic_font            auto

# Window
window_padding_width 12
remember_window_size        no
initial_window_width        950
initial_window_height       500

# Cursor
cursor_blink_interval       0.5
cursor_stop_blinking_after  1
cursor_trail 3
cursor_trail_decay 0.1 0.4

scrollback_lines            2000
wheel_scroll_min_lines      1
enable_audio_bell           no
hide_window_decorations     yes
background_opacity          1.0
dynamic_background_opacity  yes
confirm_os_window_close     0

## Tokyo Night (night) -- same tokens as the bar, see assets/waybar-design/DESIGN.md
foreground              #c0caf5
background              #1a1b26
selection_foreground    #c0caf5
selection_background    #33467c

## Cursor colors
cursor                  #c0caf5
cursor_text_color       #1a1b26

## URL underline color when hovering with mouse
url_color               #73daca

## Kitty window border colors
active_border_color     #7aa2f7
inactive_border_color   #292e42
bell_border_color       #e0af68

## OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

## Tab bar colors
active_tab_foreground   #1a1b26
active_tab_background   #7aa2f7
inactive_tab_foreground #a9b1d6
inactive_tab_background #292e42
tab_bar_background      #16161e

## Colors for marks (marked text in the terminal)
mark1_foreground #1a1b26
mark1_background #7aa2f7
mark2_foreground #1a1b26
mark2_background #bb9af7
mark3_foreground #1a1b26
mark3_background #7dcfff

