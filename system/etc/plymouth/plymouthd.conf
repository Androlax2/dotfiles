[Daemon]
Theme=motion
# Draw on the firmware framebuffer (simpledrm) right away. Without this Plymouth waits for a
# real GPU driver, and amdgpu now loads in the real root (~11 s) since the initramfs has no
# kms hook, so the splash never appeared. Baked into the initramfs: rebuild after editing.
UseSimpledrm=1
