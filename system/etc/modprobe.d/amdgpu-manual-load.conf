# udev's coldplug would load amdgpu through its PCI alias while systemd-modules-load is still
# inserting the small drivers the login path needs, and an amdgpu load blocks every other
# module load for ~2 s (see modules-load.d/early-boot.conf). blacklist only ignores the
# module's device aliases: amdgpu-load.service loads it by name right after modules-load.
# Without that unit no GPU driver loads automatically.
blacklist amdgpu
