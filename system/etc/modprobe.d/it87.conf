# The motherboard's fan chip (ITE IT8696E, Gigabyte B850 AORUS ELITE WIFI7) through the community
# it87 driver (AUR it87-dkms-git; the kernel's own it87 does not know this chip): pump and fan
# speeds for vitals. Gigabyte's firmware also claims the chip's ports, so the driver must be told
# to share them, as its README advises for these boards. It only reads; fan control stays in the BIOS.
options it87 ignore_resource_conflict=1
