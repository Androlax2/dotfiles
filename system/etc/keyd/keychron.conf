3434:d030

[main]

# Swap Ctrl and Command keys
control = layer(meta)
meta = layer(control)

# The Mac-style bottom row has no right Alt key for French symbols.
rightcontrol = layer(altgr)

# Tab switching
[meta]
tab = C-pagedown

[meta+shift]
tab = C-pageup

# Insertion point movement
[control]
left = home
right = end
up = C-home
down = C-end

[alt]
left = C-left
right = C-right
