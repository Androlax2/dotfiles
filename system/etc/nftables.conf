#!/usr/bin/nft -f
# Host firewall. Inbound is dropped unless listed here; outbound is open.
# Only "table inet filter" is touched (declared empty, flushed, then defined; never "flush
# ruleset"), so the tables Docker and Tailscale manage themselves are left alone.

define lan = 192.168.1.0/24
define tailnet_v4 = 100.64.0.0/10
define tailnet_v6 = fd7a:115c:a1e0::/48

table inet filter {}
flush table inet filter
table inet filter {
  chain input {
    type filter hook input priority filter; policy drop;

    ct state invalid drop comment "early drop of invalid connections"
    ct state { established, related } accept comment "replies to what this machine started"
    iif "lo" accept comment "loopback"
    meta l4proto { icmp, icmpv6 } accept comment "ping, path MTU, IPv6 neighbour discovery"

    # ssh only from the tailnet and the home LAN
    iifname "tailscale0" tcp dport 22 accept comment "ssh over tailscale"
    ip saddr { $lan, $tailnet_v4 } tcp dport 22 accept comment "ssh from LAN or tailnet"
    ip6 saddr $tailnet_v6 tcp dport 22 accept comment "ssh from tailnet (v6)"

    udp dport 41641 accept comment "tailscale direct connections"

    # local discovery (avahi mDNS, systemd-resolved LLMNR), LAN and link-local only
    ip saddr $lan udp dport { 5353, 5355 } accept comment "mDNS / LLMNR from the LAN"
    ip6 saddr fe80::/10 udp dport { 5353, 5355 } accept comment "mDNS / LLMNR link-local"

    pkttype host limit rate 5/second counter reject with icmpx type admin-prohibited
    counter comment "dropped"
  }

  chain forward {
    type filter hook forward priority filter; policy drop;

    # Docker's bridges route through their own chains; keep that traffic flowing.
    iifname "docker0" accept
    oifname "docker0" accept
    iifname "br-*" accept
    oifname "br-*" accept
    ct state { established, related } accept
  }
}
